name: Playwright CI
on: [push, pull_request, workflow_call]
jobs:
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: habitflow }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d habitflow" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: habitflow
      ASPNETCORE_ENVIRONMENT: Development
      HABITFLOW_BASE_URL: http://127.0.0.1:5097
      HABITFLOW_EXTERNAL_SERVER: '1'
      HABITFLOW_CI_EMAIL: playwright-ci@habitflow.local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: dotnet restore HabitFlow.sln && dotnet build HabitFlow.sln -c Release --no-restore
      - run: ./scripts/database/run-migrations.sh
      - working-directory: tests/HabitFlow.Playwright
        run: npm ci && npx playwright install --with-deps chromium
      - name: Generate ephemeral browser password
        shell: pwsh
        run: |
          $password = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(24)) + '!aA1'
          Write-Output "::add-mask::$password"
          Add-Content $env:GITHUB_ENV "HABITFLOW_CI_PASSWORD=$password"
      - name: Start ASP.NET application
        run: nohup dotnet run --no-build -c Release --project src/HabitFlow.Web --urls http://127.0.0.1:5097 > /tmp/habitflow.log 2>&1 &
      - name: Wait for health
        run: for i in {1..60}; do curl -fsS http://127.0.0.1:5097/health/ready && exit 0; sleep 2; done; cat /tmp/habitflow.log; exit 1
      - name: Provision disposable tenant user
        shell: pwsh
        run: ./scripts/validation/provision-ci-user.ps1 -Email $env:HABITFLOW_CI_EMAIL
      - name: Create authenticated browser state through the real login flow
        working-directory: tests/HabitFlow.Playwright
        env:
          HABITFLOW_AUTH_OUTPUT: playwright/.auth/ci.json
        run: |
          mkdir -p playwright/.auth
          npx playwright test auth-state.setup.js
          echo "HABITFLOW_AUTH_STORAGE=$GITHUB_WORKSPACE/tests/HabitFlow.Playwright/playwright/.auth/ci.json" >> "$GITHUB_ENV"
      - name: Execute real Playwright suites
        working-directory: tests/HabitFlow.Playwright
        run: npx playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          if-no-files-found: error
          path: |
            artifacts/v6120/screenshots
            artifacts/v6120/visual-report.md
            tests/HabitFlow.Playwright/test-results
            tests/HabitFlow.Playwright/playwright-report
            /tmp/habitflow.log
