name: v6.13.9 release gate

on:
  pull_request:
  push:
    branches:
      - feature/v6139-execute-release-gate-fix-ci-smoke-authenticated-final-approval
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  dotnet-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet --info
      - run: dotnet restore HabitFlow.sln
      - run: dotnet build HabitFlow.sln --configuration Release --no-restore
      - run: dotnet publish src/HabitFlow.Web/HabitFlow.Web.csproj --configuration Release --no-build --output artifacts/v6139-publish
      - uses: actions/upload-artifact@v4
        with:
          name: v6139-publish
          path: artifacts/v6139-publish
          if-no-files-found: error

  frontend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run security:scan
      - run: npm test
      - run: npm audit --omit=dev
      - name: Validate JavaScript syntax
        run: |
          for file in habit-library.js habits-v4.js my-day-v3.js notifications-v2.js global-search.js header-v4.js feedback-v5.js guided-tour-v4.js weekly-review.js; do
            node --check "src/HabitFlow.Web/wwwroot/js/$file"
          done

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: habitflow_ci
          POSTGRES_PASSWORD: ci_ephemeral_only
          POSTGRES_DB: habitflow_existing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U habitflow_ci -d habitflow_existing"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate fresh, existing, and rerun migrations
        shell: pwsh
        run: |
          $password = @('ci', 'ephemeral', 'only') -join '_'
          $connection = @('Host=localhost', 'Port=5432', 'Database=habitflow_existing', 'Username=habitflow_ci', "Password=$password") -join ';'
          ./scripts/validation/validate-postgres-migrations.ps1 -ConnectionString $connection -TemporaryDatabase habitflow_v6139_fresh -ReportPath artifacts/v6139/postgres-migrations-validation.md
      - uses: actions/upload-artifact@v4
        with:
          name: v6139-postgres-validation
          path: artifacts/v6139/postgres-migrations-validation.md
          if-no-files-found: error

  runtime-smoke-public:
    needs: [dotnet-build-publish, postgres-migrations]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: habitflow_ci
          POSTGRES_PASSWORD: ci_ephemeral_only
          POSTGRES_DB: habitflow_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U habitflow_ci -d habitflow_runtime"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://127.0.0.1:5097
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: v6139-publish
          path: artifacts/v6139-publish
      - name: Configure ephemeral runtime connection
        shell: pwsh
        run: |
          $password = @('ci', 'ephemeral', 'only') -join '_'
          "ConnectionStrings__DefaultConnection=Host=localhost;Port=5432;Database=habitflow_runtime;Username=habitflow_ci;Password=$password" >> $env:GITHUB_ENV
      - run: ./scripts/database/run-migrations.sh
      - name: Start published application
        run: |
          dotnet artifacts/v6139-publish/HabitFlow.Web.dll --urls http://127.0.0.1:5097 > "$RUNNER_TEMP/habitflow.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/habitflow.pid"
          for attempt in {1..60}; do
            curl --fail --silent --output /dev/null http://127.0.0.1:5097/ && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/habitflow.log"
          exit 1
      - name: Validate public routes
        run: |
          mkdir -p artifacts/v6139
          printf '# Smoke publico v6.13.9\n\n| Rota | HTTP |\n|---|---|\n' > artifacts/v6139/public-smoke-validation.md
          for route in / /login /register /plans /service-worker.js /favicon.ico; do
            code="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:5097$route")"
            test "$code" -lt 500
            printf '| `%s` | %s |\n' "$route" "$code" >> artifacts/v6139/public-smoke-validation.md
          done
      - name: Reject runtime exceptions
        if: always()
        run: |
          cat "$RUNNER_TEMP/habitflow.log"
          ! grep -E 'Unhandled exception|NpgsqlException|InvalidOperationException' "$RUNNER_TEMP/habitflow.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v6139-public-smoke
          path: |
            artifacts/v6139/public-smoke-validation.md
            ${{ runner.temp }}/habitflow.log
          if-no-files-found: error

  artifact-summary:
    if: always()
    needs: [dotnet-build-publish, frontend-security, postgres-migrations, runtime-smoke-public]
    runs-on: ubuntu-latest
    steps:
      - name: Write release gate summary
        run: |
          mkdir -p artifacts/v6139
          cat > artifacts/v6139/ci-summary.md <<EOF
          # v6.13.9 CI release gate

          | Job | Result |
          |---|---|
          | Build and publish | ${{ needs.dotnet-build-publish.result }} |
          | Frontend and security | ${{ needs.frontend-security.result }} |
          | PostgreSQL migrations | ${{ needs.postgres-migrations.result }} |
          | Public runtime smoke | ${{ needs.runtime-smoke-public.result }} |
          EOF
          cat artifacts/v6139/ci-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: v6139-release-gate-summary
          path: artifacts/v6139/ci-summary.md
          if-no-files-found: error
