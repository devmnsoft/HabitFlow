name: dotnet-ci

on:
  push:
  pull_request:

jobs:
  database-bootstrap-parity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: habitflow_test
          POSTGRES_PASSWORD: habitflow_test
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U habitflow_test -d postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: habitflow_test
      PGPASSWORD: habitflow_test
      HABITFLOW_APP_VERSION: ci
    steps:
      - uses: actions/checkout@v4
      - name: Audit aggregate inserts against NOT NULL contracts
        shell: pwsh
        run: ./scripts/qa/check-aggregate-not-null-contract.ps1
      - name: Create isolated disposable databases
        run: |
          for db in aggregate_fresh_tests runner_fresh_tests snapshot_upgrade_tests aggregate_dev_tests; do
            createdb "$db"
          done
      - name: Aggregate fresh database
        run: |
          set -o pipefail
          psql -X -v ON_ERROR_STOP=1 -d aggregate_fresh_tests -f database/script_completo.sql 2>&1 | tee /tmp/aggregate.log
          ! grep -E '(^|[[:space:]])(ERROR|FATAL|PANIC):' /tmp/aggregate.log
          psql -X -v ON_ERROR_STOP=1 -d aggregate_fresh_tests -c "select 1 from habitflow.plans having bool_and(public_name is not null and btrim(public_name)<>'');"
          psql -X -v ON_ERROR_STOP=1 -d aggregate_fresh_tests -c "select 1 from habitflow.system_settings limit 1;"
      - name: Audit required seed UUIDs
        shell: pwsh
        run: ./scripts/qa/check-seed-required-ids.ps1 -ConnectionString 'dbname=aggregate_fresh_tests'
      - name: Canonical runner fresh database and rerun
        run: |
          PGDATABASE=runner_fresh_tests ./scripts/database/run-migrations.sh
          PGDATABASE=runner_fresh_tests ./scripts/database/run-migrations.sh
      - name: Upgrade a pre-032 snapshot with runner only
        run: |
          export PGDATABASE=snapshot_upgrade_tests
          ./scripts/database/run-migrations.sh --to-version 031
          test "$(psql -XAt -c "select max(id) from habitflow.schema_migrations;")" = 031
          psql -X -v ON_ERROR_STOP=1 -f tests/fixtures/postgres/pre-032-snapshot.sql
          ./scripts/database/run-migrations.sh
          test "$(psql -XAt -c "select max(id) from habitflow.schema_migrations;")" = "$(find database/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort | tail -1 | cut -d_ -f1)"
          ./scripts/database/run-migrations.sh
          psql -X -v ON_ERROR_STOP=1 -c "select 1 from habitflow.plans having bool_and(public_name is not null and btrim(public_name)<>'');"
      - name: Development aggregate without privileged fixed credentials
        run: |
          set -o pipefail
          psql -X -v ON_ERROR_STOP=1 -d aggregate_dev_tests -f database/script_completo_dev.sql 2>&1 | tee /tmp/aggregate-dev.log
          ! grep -E '(^|[[:space:]])(ERROR|FATAL|PANIC):' /tmp/aggregate-dev.log
          test "$(psql -XAt -d aggregate_dev_tests -c "select count(*) from habitflow.users where role='SuperAdmin';")" = 0
          test "$(psql -XAt -d aggregate_dev_tests -c "select count(*) from habitflow.users;")" = 0
          psql -XAt -d aggregate_dev_tests -c "select value from habitflow.system_settings where key='dev_seed';" | grep -q 'credentialsSeeded'
      - name: Compare complete schema signatures
        run: |
          psql -XAt -d aggregate_fresh_tests -f scripts/qa/postgres-schema-signature.sql > /tmp/aggregate.signature
          psql -XAt -d runner_fresh_tests -f scripts/qa/postgres-schema-signature.sql > /tmp/runner.signature
          diff -u /tmp/aggregate.signature /tmp/runner.signature

  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: habitflow_test
          POSTGRES_PASSWORD: habitflow_test
          POSTGRES_DB: habitflow_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U habitflow_test -d habitflow_tests"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      HABITFLOW_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=habitflow_tests;Username=habitflow_test;Password=habitflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore HabitFlow.sln
      - name: Build Domain
        run: dotnet build src/HabitFlow.Domain/HabitFlow.Domain.csproj --no-restore --configuration Release
      - name: Build Application
        run: dotnet build src/HabitFlow.Application/HabitFlow.Application.csproj --no-restore --configuration Release
      - name: Build Infrastructure
        run: dotnet build src/HabitFlow.Infrastructure/HabitFlow.Infrastructure.csproj --no-restore --configuration Release
      - name: Build Web
        run: dotnet build src/HabitFlow.Web/HabitFlow.Web.csproj --no-restore --configuration Release
      - run: dotnet build HabitFlow.sln --no-restore --configuration Release
      - name: Compile Razor views
        run: dotnet publish src/HabitFlow.Web/HabitFlow.Web.csproj --no-restore --configuration Release --output artifacts/razor-compile
      - name: Apply canonical migrations to disposable PostgreSQL
        env:
          PGPASSWORD: habitflow_test
          PGHOST: localhost
          PGUSER: habitflow_test
          PGDATABASE: habitflow_tests
          HABITFLOW_APP_VERSION: ci
        run: ./scripts/database/run-migrations.sh
      - name: Prove canonical migration rerun is idempotent
        env:
          PGPASSWORD: habitflow_test
          PGHOST: localhost
          PGUSER: habitflow_test
          PGDATABASE: habitflow_tests
          HABITFLOW_APP_VERSION: ci
        run: ./scripts/database/run-migrations.sh
      - name: Unit, PostgreSQL, Dapper, DateOnly, navigation and UTF-8 tests
        run: dotnet test HabitFlow.sln --no-build --configuration Release --verbosity normal
      - name: Validate progress compile contract
        shell: pwsh
        run: ./scripts/qa/check-progress-compile-contract.ps1
      - run: dotnet format HabitFlow.sln --verify-no-changes --verbosity minimal
      - name: Validate layout contract
        shell: pwsh
        run: ./scripts/qa/check-layout-contract.ps1
      - name: Validate links
        shell: pwsh
        run: ./scripts/qa/check-links.ps1
      - name: Validate assets
        shell: pwsh
        run: ./scripts/qa/check-assets.ps1
      - name: Install Playwright tests
        working-directory: tests/HabitFlow.Playwright
        run: npm install && npx playwright install --with-deps chromium
      - name: Run visual regression tests
        working-directory: tests/HabitFlow.Playwright
        run: npm test
      - name: Publish Release
        run: dotnet publish src/HabitFlow.Web/HabitFlow.Web.csproj --no-restore --configuration Release --output artifacts/publish
      - name: Upload layout QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-visual-qa
          if-no-files-found: warn
          path: |
            tests/HabitFlow.Playwright/test-results
            tests/HabitFlow.Playwright/playwright-report
            artifacts/razor-compile
      - name: Basic secret guard
        run: |
          ! git ls-files | grep -E '(^|/)(appsettings\.Production\.json|\.env|\.env\.production)$'
