name: Reusable .NET CI
on: [workflow_call]
jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore HabitFlow.sln
      - run: dotnet build HabitFlow.sln --configuration Release --no-restore
      - run: dotnet test HabitFlow.sln --configuration Release --no-build --verbosity normal
      - run: dotnet publish src/HabitFlow.Web/HabitFlow.Web.csproj --configuration Release --no-build --output artifacts/web-publish
      - uses: actions/upload-artifact@v4
        with: { name: web-publish, path: artifacts/web-publish, if-no-files-found: error }
