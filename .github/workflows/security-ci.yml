name: Security CI
on: [push, pull_request, workflow_call]
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm run security:scan
      - run: npm test
      - run: npm audit --omit=dev
      - name: Parse principal JavaScript
        run: |
          for f in header-v4 feedback-v5 global-search navigation-premium guided-tour guided-tour-v4; do node --check "src/HabitFlow.Web/wwwroot/js/$f.js"; done
      - name: Secrets and forbidden binaries
        run: |
          ./scripts/ci/validate-v610-security.sh
          ! git ls-files | grep -Ei '(^|/)(\.env|appsettings\.Production\.json|.*\.(exe|dll|pdb|bak|zip))$'
      - name: Native dialogs and unsafe innerHTML guard
        run: |
          ! rg -n 'window\.(alert|confirm|prompt)\s*\(' src/HabitFlow.Web/wwwroot/js
          ! rg -n '\.innerHTML\s*=' src/HabitFlow.Web/wwwroot/js
