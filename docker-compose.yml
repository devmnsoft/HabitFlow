services:
  postgres:
    image: postgres:16-alpine
    container_name: habitflow-postgres
    environment:
      POSTGRES_DB: habitflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
  habitflow-app:
    build: .
    container_name: habitflow-app
    depends_on: [postgres]
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=habitflow;Username=postgres;Password=postgres
    ports: ["5097:8080"]
volumes:
  postgres_data:
