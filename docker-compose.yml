services:
  postgres:
    image: postgres:16
    container_name: habitflow-postgres
    environment:
      POSTGRES_DB: habitflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/database:ro
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d habitflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  habitflow-web:
    build: .
    container_name: habitflow-web
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=habitflow;Username=postgres;Password=postgres
    ports:
      - "5097:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: {}
