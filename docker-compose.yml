services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: habitflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  habitflow-web:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports: ["5097:8080"]
    depends_on: [postgres]
volumes: { postgres_data: {} }
